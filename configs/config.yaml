# AI-Powered Demand Forecasting & Inventory Optimization System Configuration

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  logs_dir: "logs"
  
data:
  raw_sales_file: "sales_train_evaluation.csv"
  raw_calendar_file: "calendar.csv"
  raw_prices_file: "sell_prices.csv"
  sample_submission_file: "sample_submission.csv"
  
  # Optimization for local training:
  # Set sample_stores or sample_items to null/empty list to process full dataset
  sample_stores: ["CA_1", "TX_1", "WI_1"]
  max_items_per_store: 200  # Number of top items per store for efficient pipeline execution
  forecast_horizon: 28     # 28 days holdout forecast matching M5 competition horizon

features:
  lags: [7, 14, 21, 28, 35, 42]
  rolling_windows: [7, 14, 28]
  categorical_cols:
    - item_id
    - dept_id
    - cat_id
    - store_id
    - state_id
    - event_name_1
    - event_type_1
    - event_name_2
    - event_type_2
  numeric_cols:
    - sell_price
    - price_rel_mean
    - price_change_1w
    - snap_CA
    - snap_TX
    - snap_WI
    - wday
    - month
    - year

model:
  algorithm: "LightGBM"
  random_state: 42
  lgb_params:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    random_state: 42
    n_jobs: -1
    verbose: -1

inventory:
  lead_time_days: 7            # Supplier lead time in days (L)
  target_service_level: 0.95   # Target service level (95% -> z=1.645)
  service_level_z: 1.645
  holding_cost_per_unit_day: 0.50  # Holding cost ($H/unit/day)
  ordering_cost_per_order: 25.0    # Fixed ordering cost ($S/order)
  stockout_penalty_per_unit: 5.00  # Penalty for unfulfilled demand ($p/unit)
  daily_storage_capacity: 15000    # Storage volume constraint
